          manufacturer: "ISIS (Innovative Solutions In Space)"
          description: "Integrated CubeSat EPS Type C: PIU mainboard + PBP-4S1P + PIU DaughterBoard. Adds 2 MPPT channels, 3 extra voltage domains (VD3/VD4 buck, VD5 boost), 8 extra output channels."
          mass: 0.360  # kg; typ (range 0.355–0.365 kg); PIU + PIU-DB + PBP-4S1P
          dimensions_piu_db: "96 x 92 x 16 mm"  # PIU + DaughterBoard
          dimensions_battery: "94 x 89 x 21.0 mm"  # PBP-4S1P (separate)
          energy: 57.6  # Wh; 4S1P (3.2 Ah × 4 cells)
          battery_voltage_range:  # V; 4S1P hardware thresholds
            min: 11.04  # discharge UV cutoff (falling)
            max: 16.27  # charge OV cutoff (rising)
          mppt_channels: 5  # 3 on PIU + 2 on DaughterBoard
          mppt_input_voltage_max: 15  # V
          mppt_input_current_max: 2  # A
          output_voltage_VD0: "battery voltage (unregulated)"
          output_voltage_VD1: "5 V, max 4 A total (3.01 A per channel)"
          output_voltage_VD2: "3.3 V, max 4 A total (3.01 A per channel)"
          output_voltage_VD3: "5 V default (custom 2.8–12 V), max 4 A total (3.3 A per channel); Type C only"
          output_voltage_VD4: "3.3 V default (custom 2.8–12 V), max 4 A total (3.3 A per channel); Type C only"
          output_voltage_VD5: "28.2 V default (custom Vbat–32.1 V), max 1.5 A; Type C only (boost)"
          static_power_consumption: 0.093  # W
          cell_nominal_capacity: 3.2  # Ah; 18650 cells (default)
          cell_topology: "4S1P (4 cells)"
          temp_op_no_battery:  # °C
            min: -40
            max: 85
          temp_op_discharge:  # °C
            min: -20
            max: 60
          temp_op_charge:  # °C
            min: +10
            max: 45
          battery_holding_charge: "6–8 months typ, up to 12 months (by analysis; intermediate check recommended >8 months) at -20 to +20 °C"
          source: "Innovative Solutions In Space (ISIS) B.V. 'ICEPS2 Integrated CubeSat EPS Datasheet,' Doc. No. ISIS-ICEPS2-DSH-0001, Issue 1.2, 2024.
