        dcep_min_occurrence: 1
        dcep_no_value: true
      n_verbosity:
        dcep_info:
          dcep_name: Verbosity Frequency
          dcep_unit: "-"
          dcep_description: Number of generations to pass before new status output is generated
          dcep_type: float
          dcep_no_value: false
          dcep_default: 5
          dcep_min_occurrence: 1
          dcep_max_occurrence: 1
          dcep_min_inclusive: 0
    xml:
      dcep_info:
        dcep_name: Options for XML Files
        dcep_description: Definitions for XML data content and generation
        dcep_min_occurrence: 1
        dcep_no_value: true
      full_history:
        dcep_info:
          dcep_name: Full history
          dcep_unit: "-"
          dcep_description: Produce an XML file with the full evolutionary history, i.e. every generation of every lineage. Might be time consuming to outpt. Not DCEP supported, mainly for debugging. Options 0 or 1
          dcep_type: float
          dcep_no_value: false
          dcep_default: 0
          dcep_min_occurrence: 1
          dcep_max_occurrence: 1
          dcep_min_inclusive: 0
      optimal_candidates:
        dcep_info:
          dcep_name: Optimal Solutions
          dcep_unit: "-"
          dcep_description: Produce an XML file with a set number of optimal candidates to be included per input case. Increasing the number might be time consuming.
          dcep_type: float
          dcep_no_value: false
          dcep_default: 5
          dcep_min_occurrence: 1
          dcep_max_occurrence: 1
          dcep_min_inclusive: 0
