    dcep_description: Orbit height defauts are defined here
    dcep_min_occurrence: 1
    dcep_no_value: true
    orbit_min:
      dcep_name: Minimum orbit height
      dcep_unit: km
      dcep_description: Minimum orbit height considered during orbit height variation
      dcep_type: float
      dcep_no_value: false
      dcep_default: 350
      dcep_min_occurrence: 1
      dcep_max_occurrence: 1
      dcep_min_inclusive: 0
    orbit_max:
      dcep_name: Maximum orbit height
      dcep_unit: km
      dcep_description: Maximum orbit height considered during orbit height variation
      dcep_type: float
      dcep_no_value: false
      dcep_default: 45000
      dcep_min_occurrence: 1
      dcep_max_occurrence: 1
      dcep_min_inclusive: 0
    orbit:
      dcep_info:
        dcep_name: Default orbit heights
        dcep_description: Default orbit heights to be used if none are given
        dcep_min_occurrence: 1
        dcep_no_value: true
      no_propulsion:
        dcep_info:
          dcep_name: "Default orbit height - no propulsion"
          dcep_unit: km
          dcep_description: Default orbit heights to be used if none is given for the case of no propulsion
          dcep_type: float
          dcep_no_value: false
          dcep_default: 550
          dcep_min_occurrence: 1
          dcep_max_occurrence: 1
          dcep_min_inclusive: 0
      Low_Earth:
        dcep_info:
          dcep_name: "Default orbit height - LEO"
          dcep_unit: km
          dcep_description: Default orbit heights to be used if none is given for the case of propelled LEO spacecraft
          dcep_type: float
          dcep_no_value: false
          dcep_default: 1000
          dcep_min_occurrence: 1
          dcep_max_occurrence: 1
          dcep_min_inclusive: 0
      High_Earth:
        dcep_info:
          dcep_name: "Default orbit height - HEO"
          dcep_unit: km
          dcep_description: Default orbit heights to be used if none is given for the case of propelled HEO spacecraft (GEO)
          dcep_type: float
          dcep_no_value: false
          dcep_default: 35786
          dcep_min_occurrence: 1
          dcep_max_occurrence: 1
          dcep_min_inclusive: 0
  evolver:
    dcep_info:
      dcep_name: Evolver parameters
      dcep_description: Default orbit heights to be used if none are given
      dcep_min_occurrence: 1
      dcep_no_value: true
    fitness_criterion:
      dcep_info:
        dcep_name: Fitness criterion
        dcep_unit: "-"
        dcep_description: "Objective function used by the evolver. Options: maximize_mass_margin (maximise dry mass margin), maximize_payload_mass (maximise payload mass at constant total mass), minimize_total_mass (minimise total spacecraft mass)."
        dcep_type: string
        dcep_no_value: false
        dcep_default: maximize_mass_margin
        dcep_min_occurrence: 0
        dcep_max_occurrence: 1
        dcep_allowed_values: [maximize_mass_margin, maximize_payload_mass, minimize_total_mass]
    random_seed:
      dcep_info:
        dcep_name: Random seed
        dcep_unit: "-"
        dcep_description: "Fixed integer seed for the random number generator. Set to a positive integer for deterministic/reproducible runs (debugging). Set to 0 (default) for non-deterministic seeding."
        dcep_type: float
        dcep_no_value: false
        dcep_default: 0
        dcep_min_occurrence: 0
        dcep_max_occurrence: 1
        dcep_min_inclusive: 0
    seed_points:
      dcep_info:
        dcep_name: Seed point number
        dcep_unit: "-"
        dcep_description: efine number of seed points/lineages to be used per input case"
        dcep_type: float
        dcep_no_value: false
        dcep_default: 50
        dcep_min_occurrence: 1
        dcep_max_occurrence: 1
        dcep_min_inclusive: 0
    minimal_step_size:
      dcep_info:
        dcep_name: Evolution minimal mutation resolution
        dcep_unit: "-"
        dcep_description: volution algorithm minimal mutation resolution for continuous degrees of freedom
        dcep_type: float
        dcep_no_value: false
        dcep_default: 1e-05
        dcep_min_occurrence: 1
        dcep_max_occurrence: 1
    max_jump_range:
      dcep_info:
        dcep_name: Evolution maximum mutation range
        dcep_unit: "-"
        dcep_description: "Evolution algorithm maximum mutation step size - multiple of minimal resolution."
        dcep_type: float
        dcep_no_value: false
        dcep_default: 50
        dcep_min_occurrence: 1
        dcep_max_occurrence: 1
        dcep_min_inclusive: 0
    n_fails_to_converge:
      dcep_info:
        dcep_name: Evolution convergence threshold
        dcep_unit: "-"
        dcep_description: Number of evolution attemps before convergence is assumed
        dcep_type: float
        dcep_no_value: false
        dcep_default: 50
        dcep_min_occurrence: 1
        dcep_max_occurrence: 1
        dcep_min_inclusive: 0
    n_bad_seed_to_converge:
      dcep_info:
        dcep_name: Bad-seed stall threshold
        dcep_unit: "-"
        dcep_description: Number of generations without any successful mutation before a lineage is treated as a bad initial seed. Recommended value: 3 times n_fails_to_converge.
        dcep_type: float
        dcep_no_value: false
        dcep_default: 150
        dcep_min_occurrence: 1
        dcep_max_occurrence: 1
        dcep_min_inclusive: 0
  output:
    dcep_info:
      dcep_name: Output definition parameters
      dcep_description: Options to define how output is generated is defined here
      dcep_min_occurrence: 1
      dcep_no_value: true
    CLI:
      dcep_info:
        dcep_name: Options for CLI and Log File
