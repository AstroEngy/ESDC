# ESDC YAML Data File
# Octave 9.1.0

Simulation_parameters:
  defaults:
    orbit_min: 350
    orbit_max: 45000
    orbit:
      no_propulsion: 550
      Low_Earth: 1000
      High_Earth: 35786
  evolver:
    fitness_criterion: minimize_total_mass
    seed_points: 18
    fitness_landscape_resolution: 50
    minimal_step_size: 1e-05
    max_jump_range: 20
    n_fails_to_converge: 10
    n_bad_seed_to_converge: 30
    n_verbosity: 10
  output:
    CLI:
      n_verbosity: 10
    xml:
      full_history: 0
      optimal_candidates: 1
    plots:
      system: 1
      components: 1
