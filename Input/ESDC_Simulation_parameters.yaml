# ESDC YAML Data File
# Generated: 2025-10-30 14:16:55
# Octave 9.1.0

Simulation_parameters:
  defaults:
    orbit_min: 350
    orbit_max: 45000
    orbit:
      no_propulsion: 550
      Low_Earth: 1000
      High_Earth: 35786
    # Default mission lifetimes applied when no mission_duration or maneuver_duration_max
    # is specified in the input case. Sources:
    #   sc_type 1 (No Propulsion / LEO passive): SMAD (Wertz 2011), typical CubeSat 2-5 yr
    #   sc_type 2 (LEO, dv <= 2000 m/s)        : SMAD Table 1-3, median LEO operational lifetime
    #   sc_type 3 (GEO/HEO, dv <= 4300 m/s)    : ECSS-E-ST-10-04C, GEO commercial design life
    #   sc_type 4 (Planetary, dv > 4300 m/s)    : representative of Cassini 13yr, Rosetta/New Horizons 10yr
    # propulsion_time_fraction: SMAD 2011 p.693 ff., typical EP duty cycles 5-20%; 10% used.
    mission_duration_years:
      sc_type_1: 3
      sc_type_2: 5
      sc_type_3: 15
      sc_type_4: 10
    propulsion_time_fraction: 0.10
    # sc_type classification thresholds — priority: explicit sc_type > orbit_height > delta_v
    # orbit_height_leo_max [km]: LEO/GEO-HEO altitude boundary (SMAD 2011 p.131)
    # dv_geo_min / dv_escape_min [m/s]: delta-v boundaries for sc_type inference
    sc_type_thresholds:
      orbit_height_leo_max: 2000
      dv_geo_min: 2000
      dv_escape_min: 4300
  io:
    # prefer_xml: when true, XML database/input files take precedence over YAML.
    # Set to true to force XML-only reads (e.g. for testing the XML path without
    # renaming or deleting YAML files).  Default: false (YAML preferred).
    prefer_xml: false
  evolver:
    fitness_criterion: maximize_mass_margin
    random_seed: 42
    seed_points: 18
    fitness_landscape_resolution: 50
    minimal_step_size: 1e-05
    max_jump_range: 20
    n_fails_to_converge: 10
    n_bad_seed_to_converge: 30
    n_verbosity: 10
  output:
    CLI:
      n_verbosity: 10
    xml:
      full_history: 0
      optimal_candidates: 5
    plots:
      system: 1
      components: 1
